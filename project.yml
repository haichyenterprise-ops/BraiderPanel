name: BraiderPanel
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.22.0
targets:
  BraiderPanel:
    type: application
    platform: iOS
    sources:
      - path: BraiderPanel
        excludes:
          - "Info.plist"
      - path: BraiderPanel/GoogleService-Info.plist
        buildPhase: resources
    info:
      path: BraiderPanel/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "BraiderPanel uses your location to place you on the customer map."
        NSPhotoLibraryUsageDescription: "BraiderPanel needs access to your photos to add portfolio images and your profile picture."
        NSCameraUsageDescription: "BraiderPanel uses your camera to take profile photos."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BraiderPanel
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BraiderPanel/Info.plist
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
      - product: FirebaseDatabase
